# Builds an installable Android test app (debug APK) from web/.
# Needs repository variables VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY
# (Settings → Secrets and variables → Actions → Variables). The publishable key is
# the same one every browser already receives; the secret key never goes here.
name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [v2-design, main]
    paths: ['web/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Set the two VITE_ repository variables first"; exit 1; }
          npx tsc -b && npx vite build --mode mobile
      - run: npx cap sync android
      - name: Build the APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ders-android-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
